<!DOCTYPE html>
<html>
<head>
    <title>Register - Smart Home Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <h1>Create Account</h1>

    <form action="/register" method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Create Account
    </button>

</form>
    <p>
        Already have an account?
        <a href="/">Login</a>
    </p>

</div>

</body>
</html>
